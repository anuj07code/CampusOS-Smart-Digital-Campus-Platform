<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Registration Form</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f2f2f2; padding: 20px; }
        form { background: #fff; max-width: 450px; margin: auto; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="email"], input[type="password"], select { width: 100%; padding: 8px; box-sizing: border-box; }
        input[type="submit"] { background: #28a745; color: white; padding: 10px 15px; border: none; cursor: pointer; width: 100%; border-radius: 4px; font-size: 16px; }
        input[type="submit"]:hover { background: #218838; }
    </style>
</head>
<body>

    <form>
        <h2 style="text-align: center;">Register</h2>
        
        <div class="form-group">
            <label>Full Name:</label>
            <input type="text" name="fullname" required>
        </div>

        <div class="form-group">
            <label>Email Address:</label>
            <input type="email" name="email" required>
        </div>

        <div class="form-group">
            <label>Password:</label>
            <input type="password" name="password" required>
        </div>

        <div class="form-group">
            <label>Gender:</label>
            <input type="radio" name="gender" value="male"> Male 
            <input type="radio" name="gender" value="female"> Female
        </div>

        <div class="form-group">
            <label>Hobbies:</label>
            <input type="checkbox" name="hobby1" value="reading"> Reading 
            <input type="checkbox" name="hobby2" value="sports"> Sports
        </div>

        <div class="form-group">
            <label>Country:</label>
            <select name="country">
                <option value="usa">United States</option>
                <option value="ind">India</option>
                <option value="uk">United Kingdom</option>
            </select>
        </div>

        <input type="submit" value="Register">
    </form>

</body>
</html>
